name = "mailfreeg"
# name = "mail-exhibit"
main = "src/server.js"
compatibility_date = "2024-01-01"
keep_vars=true

# D1 数据库绑定
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "mail" #你的d1数据库名称
database_id = "4b6dab54-ed7f-4017-b59f-a234d0ae907c" # 你的database_id
# 登录会话过期时间（单位：天，默认7天）
# 环境变量
[vars]
# FORWARD_RULES="[{"prefix":"vip","email":"a@example.com"},{"prefix":"*","email":"example@qq.com"}]"
ADMIN_NAME="wuming"
ADMIN_PASSWORD="56215487wqy..."
GUEST_PASSWORD="56215487"
JWT_TOKEN="dfvhluhdaslufhvdv"
JWT_TOKENGUEST_PASSWORD="dfsfsfxzcv"
SESSION_EXPIRE_DAYS="365"
MAIL_DOMAIN="ooooa.kdns.fr,ooooc.kdns.fr"
RESEND_API_KEY="RESEND发件密钥"
SENDFLARE_API_KEY="SENDFLARE发件密钥"
CYBERPERSONS_API_KEY="CYBERPERSONS发件密钥"


# 静态资源目录（Workers + Assets）
[assets]
directory = "public"
# 显式指定绑定名，确保在 Worker 中通过 env.ASSETS 可用
binding = "ASSETS"


# R2 存储桶绑定（用于保存完整 EML 内容）
[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "maill"

# wrangler.toml (wrangler v3.88.0^) 日志服务
# [observability.logs]
# enabled = true